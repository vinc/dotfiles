[colors]
include-file = $HOME/.config/polybar/gruvbox-dark.ini

[bar/bspwm]
width = 100%
fixed-center = true
background = ${colors.background}
foreground = ${colors.foreground}
line-size = 0
border-size = 0
padding-left = 1
padding-right = 1
module-margin-left = 0
module-margin-right = 0
font-0 = Inconsolata:size=18;2
font-1 = "MaterialIcons:size=14;3"
modules-left = geodate
modules-center = bspwm
modules-right = memory acpi-battery-0 acpi-battery-1
cursor-click = pointer
cursor-scroll = ns-resize
override-redirect = true
wm-restack = bspwm

[module/bspwm]
type = internal/bspwm
label-focused = %index%
label-focused-background = ${colors.background-alt}
label-focused-padding = 1
label-occupied = %index%
label-occupied-padding = 1
label-urgent = %index%
label-urgent-foreground = ${colors.alert}
label-urgent-padding = 1
label-empty = %index%
label-empty-foreground = ${colors.foreground-alt}
label-empty-padding = 1

[module/memory]
type = internal/memory
interval = 5
format = <label>
label = %percentage_used%%

[module/geodate]
type = custom/script
exec = geodate 48.5159 -3.3333 --format "%h%y-%m-%d %c:%b"
interval = 8.64

[module/acpi-battery-0]
type = custom/script
exec = bash ~/.config/polybar/battery.sh BAT0
interval = 5
label-padding = 1

[module/acpi-battery-1]
type = custom/script
exec = bash ~/.config/polybar/battery.sh BAT1
interval = 5

[settings]
screenchange-reload = true

[global/wm]
margin-top = 0
margin-bottom = 0

; vim:ft=dosini
